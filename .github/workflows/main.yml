name: build

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - ".github/workflows/main.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install domain-list-community
        run: go install github.com/v2fly/domain-list-community@latest

      - name: Build geosite.dat
        run: |
          mkdir -p output
          $(go env GOPATH)/bin/domain-list-community -datapath ./data -outputname geosite.dat -outputdir ./output

      - name: Sanity check
        working-directory: output
        run: |
          test -s geosite.dat
          test "$(stat -c %s geosite.dat)" -ge 5000

      - name: Checksum
        working-directory: output
        run: |
          sha256sum geosite.dat | tee geosite.dat.sha256sum
          sha256sum geosite.dat | cut -d' ' -f1 > geosite.dat.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: geosite
          path: output/
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.run_number }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: geosite
          path: output

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.run_number }}
          name: ${{ github.run_number }}
          draft: true
          files: output/*

      - name: Verify assets
        run: |
          set -euo pipefail
          names=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for f in output/*; do
            base=$(basename "$f")
            echo "$names" | grep -qx "$base" || { echo "missing asset: $base" >&2; exit 1; }
          done

      - name: Publish release
        run: gh release edit "$TAG" --draft=false --latest
