name: Build Custom GeoSite

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set Release Variables
        run: |
          echo "RELEASE_NAME=Build $(date +%Y.%m.%d-%H%M)" >> $GITHUB_ENV
          echo "TAG_NAME=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV

      - name: Checkout local repository
        uses: actions/checkout@v4

      - name: Checkout v2fly/domain-list-community (Generator)
        uses: actions/checkout@v4
        with:
          repository: v2fly/domain-list-community
          path: community-generator

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Copy local categories to build directory
        run: |
          cp -R ./data/* ./community-generator/data/

      - name: Build geosite.dat
        run: |
          cd community-generator
          go run ./ --datapath=./data

      - name: Prepare Publish Directory
        run: |
          mkdir -p publish
          cp ./community-generator/publish/dlc.dat ./publish/geosite.dat
          
          cd publish
          sha256sum geosite.dat > geosite.dat.sha256sum

      - name: Push geosite.dat to "release" branch
        run: |
          cd publish
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add .
          git commit -m "${{ env.RELEASE_NAME }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin release

      - name: Create GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: ${{ env.RELEASE_NAME }}
          tag: ${{ env.TAG_NAME }}
          file_glob: true
          file: ./publish/*

      - name: Purge jsDelivr CDN Cache
        run: |
          curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/geosite.dat"
